<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>喵呜 · 控制台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f6f3ef; --card:#fffdfb; --line:#ece4da; --ink:#2c2a28;
    --dim:#8a837b; --accent:#c1743f; --accent-soft:#fdefe2; --ok:#3d7a56; --bad:#c0442f; --warn:#b07d20;
    --nav-h:60px;
  }
  html,body{height:100%}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}

  /* ---------- 顶栏 ---------- */
  header{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--card);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
  header h1{font-size:19px;letter-spacing:3px;flex:none}
  .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);min-width:0}
  .who select{max-width:180px;padding:4px 8px;font-size:12px}
  nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  nav button{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;
    font-size:13px;color:var(--dim);font-family:inherit;white-space:nowrap}
  nav button:hover{background:#f6efe8;color:var(--ink)}
  nav button.on{background:var(--accent-soft);color:#a3602f;font-weight:600}
  header .out{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;
    font-size:12px;color:#5c554e;cursor:pointer;font-family:inherit;flex:none}

  main{padding:20px 22px 60px;max-width:1080px;margin:0 auto}

  /* ---------- 卡片 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;
    box-shadow:0 1px 4px rgba(120,96,74,.04);min-width:0}
  .card h3{font-size:12px;color:var(--accent);letter-spacing:1.5px;margin-bottom:9px;
    display:flex;align-items:center;gap:6px}
  .card h3 .go{margin-left:auto;font-size:11px;color:#c9b8a8;letter-spacing:0}
  .card.link{cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
  .card.link:hover{border-color:#d8a57c;transform:translateY(-1px);box-shadow:0 4px 14px rgba(120,96,74,.09)}
  .card.link:hover h3 .go{color:var(--accent)}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0}
  .kv .k{color:var(--dim);white-space:nowrap;flex:none}
  .kv .v{min-width:0;text-align:right;word-break:break-all}
  .kv.full{display:block}
  .kv.full .k{display:block;margin-bottom:5px}
  .kv.full input,.kv.full select,.kv.full textarea{width:100%}
  .muted{color:var(--dim);font-size:12px}
  .mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12.5px;color:var(--fg);
    word-break:break-all;user-select:all;margin-top:2px}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .big{font-size:20px;font-weight:600}

  button.act{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;
    cursor:pointer;font-size:12.5px;font-family:inherit;color:#5c554e}
  button.act:hover{border-color:#d8a57c;color:#a3602f}
  button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.act.primary:hover{background:#b0693c;color:#fff}
  button.act.danger:hover{border-color:#e0b4ab;color:var(--bad)}
  button.act:disabled{opacity:.5;cursor:default}

  input[type=text],input[type=password],input[type=number],select,textarea{font-family:inherit;font-size:13px;
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fbf8f5;outline:none;color:var(--ink);max-width:100%}
  input:focus,select:focus,textarea:focus{border-color:#d8a57c;background:#fff}
  textarea{width:100%;min-height:300px;font-family:"Cascadia Mono",Consolas,monospace;font-size:12px;line-height:1.55}

  h2.sec{font-size:14px;margin:22px 0 10px;padding-left:9px;border-left:3px solid #e0a173;letter-spacing:1px}
  .list{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;min-width:0;flex-wrap:wrap}
  .item .name{font-size:13px;flex:none;min-width:132px}
  .item .desc{font-size:12px;color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .sp{flex:1}
  .pill{font-size:11px;color:#8a6a4f;background:#f8f1e9;border-radius:20px;padding:1px 8px;flex:none}
  .pill.ok{background:#eaf4ee;color:var(--ok)}
  .pill.bad{background:#fbebe8;color:var(--bad)}
  .pill.warn{background:#fdf3e0;color:var(--warn)}

  pre.block{background:#fbf8f5;border:1px solid var(--line);border-radius:10px;padding:12px;
    font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
    max-height:360px;overflow:auto;font-family:"Cascadia Mono",Consolas,"Microsoft YaHei",monospace}

  /* 上下文进度条 */
  .bar{height:7px;border-radius:99px;background:#efe7dd;overflow:hidden;margin:8px 0 4px}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8fbf9f,#c1743f);transition:width .3s}
  .bar i.hi{background:linear-gradient(90deg,#e0a173,#c0442f)}

  .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);
    background:#2c2a28;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;
    transition:opacity .2s;pointer-events:none;z-index:99;max-width:86vw;text-align:center}
  .toast.on{opacity:1}
  .empty{color:var(--dim);font-size:12.5px;padding:10px 2px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  /* 在线状态点 + 掉线横幅 */
  .dot{width:9px;height:9px;border-radius:99px;background:#c0442f;display:inline-block;flex:none}
  .dot.ok{background:#3d7a56;box-shadow:0 0 0 3px #3d7a5622}
  .dot.bad{background:#c0442f;box-shadow:0 0 0 3px #c0442f22}
  .offline{background:#fdf0ec;border:1px solid #f0cfc5;border-radius:13px;padding:14px 16px;
    display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .offline img{width:148px;height:148px;border-radius:10px;background:#fff;border:1px solid var(--line)}
  .offline .muted{max-width:420px}

  /* 记忆统计图 */
  .stat{display:flex;gap:3px;align-items:flex-end;height:64px;margin:8px 0 2px}
  .stat i{flex:1;background:linear-gradient(180deg,#e8b98d,#c1743f);border-radius:3px 3px 0 0;min-height:2px}
  .stat-lab{display:flex;gap:3px}
  .stat-lab span{flex:1;text-align:center;font-size:9.5px;color:var(--dim);overflow:hidden;white-space:nowrap}

  /* 服务行 */
  .svc{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
  .svc:last-child{border-bottom:0}
  .svc .name{font-size:13px;min-width:190px;flex:none}
  .svc .desc{font-size:12px;color:var(--dim);flex:1;min-width:120px}

  /* ---------- 手机 ---------- */
  @media(max-width:820px){
    header{padding:10px 14px 8px;gap:8px}
    header h1{font-size:17px;letter-spacing:2px}
    .who{margin-left:auto;order:2}
    header .out{order:3}
    nav{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:flex-start;flex-wrap:nowrap;
      gap:2px;background:var(--card);border-top:1px solid var(--line);
      padding:6px 8px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;z-index:40;
      -webkit-overflow-scrolling:touch;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    nav button{flex:0 0 auto;padding:8px 13px;font-size:12.5px;border-radius:8px}
    main{padding:14px 13px calc(var(--nav-h) + 26px)}
    .grid{grid-template-columns:1fr;gap:11px}
    .split{grid-template-columns:1fr}
    .item .name{min-width:0;flex:1 1 100%}
    .item .desc{flex:1 1 100%;white-space:normal}
    h2.sec{margin:18px 0 9px}
  }
  @media(min-width:821px){
    nav{order:3}
  }
</style>
</head>
<body>
<header>
  <h1>喵呜</h1>
  <span id="netdot" class="dot bad" title="连接状态"></span>
  <div class="who" id="who"></div>
  <nav id="nav">
    <button data-tab="home" class="on">概览</button>
    <button data-tab="chars">角色</button>
    <button data-tab="mem">记忆</button>
    <button data-tab="voice">语音</button>
    <button data-tab="clock">定时</button>
    <button data-tab="st">酒馆</button>
    <button data-tab="mods">插件</button>
    <button data-tab="api">API</button>
    <button data-tab="health">接入</button>
    <button data-tab="cfg">配置</button>
  </nav>
  <button class="out" onclick="logout()">退出</button>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
/* ================= 基础 ================= */
const $ = s => document.querySelector(s)
const main = $('#main')
let TAB = 'home'
let STATE = null

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue
    if (k === 'class') n.className = v
    else if (k === 'text') n.textContent = v
    else if (k === 'html') n.innerHTML = v
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
    else n.setAttribute(k, v)
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue
    n.append(typeof c === 'string' ? document.createTextNode(c) : c)
  }
  return n
}
function toast(msg) {
  const t = $('#toast')
  t.textContent = msg
  t.classList.add('on')
  clearTimeout(t._h)
  t._h = setTimeout(() => t.classList.remove('on'), 2200)
}
async function api(path, opt) {
  const r = await fetch(path, opt)
  if (r.status === 401) { location.href = '/'; throw new Error('未登录') }
  return r.json()
}
const post = (p, body) => api(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
const del = p => api(p, { method: 'DELETE' })

/* ================= 在线状态 / 二维码自动刷新 ================= */
let QR_LAST_MTIME = 0
let OFFLINE_BOX = null
function sinceText(ts) {
  if (!ts) return ''
  const m = Math.max(1, Math.round((Date.now() - ts) / 60000))
  if (m < 60) return m + ' 分钟'
  return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分钟'
}
async function pollQR() {
  try {
    const r = await api('/api/qr')
    const dot = $('#netdot')
    if (dot) dot.className = 'dot ' + (r.online ? 'ok' : 'bad')
    dot && (dot.title = r.online ? '在线' : '离线 · 打开概览扫码')
    if (!r.online && r.img) {
      showOfflineQR(r.img, r.mtime, r.offlineSince)
      QR_LAST_MTIME = r.mtime
      setTimeout(pollQR, 5000)
    } else {
      hideOfflineQR()
      setTimeout(pollQR, r.online ? 30000 : 8000)
    }
  } catch { setTimeout(pollQR, 15000) }
}
function showOfflineQR(img, mtime, offlineSince) {
  if (TAB !== 'home') return            // 横幅只在概览页显示
  if (OFFLINE_BOX && document.body.contains(OFFLINE_BOX)) {
    const im = OFFLINE_BOX.querySelector('img')
    if (im && mtime !== QR_LAST_MTIME) im.src = img
    OFFLINE_BOX.querySelector('.offtime').textContent =
      `已离线 ${sinceText(offlineSince)} · 二维码 ${Math.max(1, Math.round((Date.now() - mtime) / 60000))} 分钟前刷新（自动续，不用管）`
    return
  }
  OFFLINE_BOX = el('div', { class: 'offline' },
    el('img', { src: img, alt: '登录二维码' }),
    el('div', {},
      el('b', {}, '她掉线了'),
      el('div', { class: 'muted offtime' },
        `已离线 ${sinceText(offlineSince)} · 二维码自动续，不用管`),
      el('div', { class: 'muted' }, '手机 QQ 扫左侧二维码，几秒内自动上线。')),
  )
  const first = main.firstChild
  main.insertBefore(OFFLINE_BOX, first)
}
function hideOfflineQR() {
  if (OFFLINE_BOX && document.body.contains(OFFLINE_BOX)) { OFFLINE_BOX.remove(); OFFLINE_BOX = null }
}

/* ================= 顶栏用户 ================= */
async function loadWho() {
  try {
    const r = await api('/api/users')
    const box = $('#who')
    if (!r.ok || !r.list.length) { box.replaceChildren(); return }
    if (r.list.length === 1) {
      box.replaceChildren(el('span', {}, 'QQ ' + r.list[0].qq))
      return
    }
    const sel = el('select', {
      onchange: async e => {
        const x = await post('/api/user', { qq: e.target.value })
        if (x.ok) { toast('已切到 ' + x.current); switchTab(TAB) }
        else toast(x.msg || '切换失败')
      }
    }, r.list.map(u => el('option', { value: u.qq, ...(u.qq === r.current ? { selected: 'selected' } : {}) },
      u.qq + (u.master ? '（主人）' : ''))))
    sel.value = r.current
    box.replaceChildren(el('span', {}, '看谁的'), sel)
  } catch {}
}

/* ================= 概览 ================= */
async function tabHome() {
  const s = await api('/api/state')
  STATE = s
  const pr = s.pressure
  const pct = pr ? Math.min(100, Math.round(pr.usage.ratio * 100)) : 0
  const lv = pr && (pr.usage.level === 'high' || pr.usage.level === 'over')

  const link = (title, to, rows, extra) => el('div', { class: 'card link', onclick: () => switchTab(to) },
    el('h3', {}, title, el('span', { class: 'go' }, '查看 ›')),
    rows.map(([k, v]) => el('div', { class: 'kv' },
      el('span', { class: 'k' }, k),
      el('span', { class: 'v', text: String(v) }),
    )),
    extra || null,
  )

  main.replaceChildren(
    el('div', { class: 'grid' },
      link('后端', 'cfg', [
        ['当前', s.backend ? s.backend.name : '未配置'],
        ['模型', s.backend ? s.backend.model : '-'],
        ['Key', s.backend ? s.backend.key : '-'],
      ]),
      link('出场', 'chars', [
        ['角色', s.card ? s.card.name : '（无）'],
        ['id', s.card ? s.card.id : '-'],
        ['卡池', s.cards + ' 张'],
      ]),
      link('上下文', 'mem', [
        ['占用', pr ? pr.text : '—'],
        ['轮数', s.memory.turns + ' 轮'],
        ['策略', s.compress.mode === 'auto' ? '自动压' : s.compress.mode === 'manual' ? '只手动' : '到线提醒'],
      ],
        el('div', {},
          el('div', { class: 'bar' }, el('i', { class: lv ? 'hi' : '', style: 'width:' + pct + '%' })),
          el('div', { class: 'muted' }, pr && Number.isFinite(pr.left)
            ? (pr.left > 400 ? '还能聊很久 · 点这里看详情' : `还能聊约 ${pr.left} 轮 · 点这里看详情`)
            : '点这里看详情'),
        ),
      ),
      link('定时', 'clock', [
        ['时刻', s.clock.now],
        ['日期', s.clock.date],
        ['节日', s.clock.festival || '—'],
        ['挂着', s.clock.reminds + ' 个提醒'],
      ]),
    ),
    el('h2', { class: 'sec' }, '服务'),
    el('div', { class: 'card', id: 'svcBox' }, el('div', { class: 'empty' }, '探测中…')),
    el('h2', { class: 'sec' }, '快捷'),
    el('div', { class: 'row' },
      btn('重新体检', () => switchTab('health')),
      btn('压一次上下文', async () => {
        if (!confirm('现在压缩？压完她的语气可能会淡一点。')) return
        toast('压缩中…')
        const r = await post('/api/compress', {})
        toast(r.ok ? r.msg : (r.msg || '没压成'))
        if (r.ok) tabHome()
      }),
      btn('语音设置', () => switchTab('voice')),
      btn('主动发言', () => switchTab('cfg')),
      btn('看记忆', () => switchTab('mem')),
      btn('刷新', () => switchTab('home')),
    ),
    el('div', { id: 'extZone', style: 'margin-top:14px' }),
  )
  renderServices()
}

function btn(label, fn, cls = 'act') {
  return el('button', { class: cls, onclick: fn }, label)
}

/* ================= 角色 ================= */
async function tabChars() {
  const [s, data] = await Promise.all([api('/api/state'), api('/api/chars')])
  const list = el('div', { class: 'list' },
    data.list.map(c => el('div', { class: 'item' },
      el('span', { class: 'name' }, (c.id === (s.card && s.card.id) ? '▸ ' : '') + c.name),
      el('span', { class: 'pill' }, c.format),
      el('span', { class: 'desc' }, (c.tags || []).join(' · ')),
      btn('看', () => showChar(c.id)),
    )),
  )
  const imp = el('div', { class: 'row' },
    el('input', { type: 'text', id: 'impPath', placeholder: '本机角色卡路径（md / json / png）', style: 'flex:1;min-width:200px' }),
    btn('导入', async () => {
      const p = $('#impPath').value.trim()
      if (!p) return toast('先填路径')
      const r = await post('/api/char/import', { path: p })
      toast(r.msg || (r.ok ? '导入成功' : '失败'))
      if (r.ok) tabChars()
    }, 'act primary'),
  )
  main.replaceChildren(
    el('h2', { class: 'sec' }, '角色卡（' + data.list.length + '）'),
    list,
    el('h2', { class: 'sec' }, '导入'),
    imp,
    el('div', { class: 'muted', style: 'margin-top:8px;word-break:break-all' }, '目录：' + data.dir),
    el('h2', { class: 'sec' }, '详情'),
    el('div', { id: 'charBox' }, el('div', { class: 'empty' }, '点上面的「看」')),
  )
}

async function showChar(id) {
  const r = await api('/api/char?id=' + encodeURIComponent(id))
  const box = $('#charBox')
  if (!r.ok) return (box.textContent = r.msg)
  const c = r.card
  const sec = (t, v) => v ? [el('h2', { class: 'sec' }, t), el('pre', { class: 'block', text: v })] : []
  box.replaceChildren(
    el('div', { class: 'row', style: 'margin-bottom:8px' },
      el('b', {}, c.name), el('span', { class: 'pill' }, c.format || '?'),
      c.inheritedFrom.length ? el('span', { class: 'muted' }, '继承：' + c.inheritedFrom.join(' → ')) : null,
    ),
    ...sec('你是谁', c.description),
    ...sec('性格', c.personality),
    ...sec('说话方式', c.styleExtra),
    ...sec('关系', c.relExtra),
    ...sec('小习惯', c.habitExtra),
    ...sec('关于画图', c.drawExtra),
    ...sec('场景', c.scenario),
    ...sec('示例对话', c.mesExample),
    ...sec('开场白', [c.firstMes, ...(c.greetingPool || [])].filter(Boolean).join('\n---\n')),
  )
  box.scrollIntoView({ behavior: 'smooth', block: 'start' })
}

/* ================= 记忆 ================= */
async function tabMem(profile) {
  const r = await api('/api/memory' + (profile ? '?profile=' + encodeURIComponent(profile) : ''))
  if (!r.ok) return main.replaceChildren(el('div', { class: 'empty' }, r.msg || '读取失败'))

  const c = await api('/api/context').catch(() => null)
  const pct = c ? Math.min(100, Math.round(c.usage.ratio * 100)) : 0
  const hi = c && (c.usage.level === 'high' || c.usage.level === 'over')

  const sel = el('select', {
    onchange: e => tabMem(e.target.value),
  }, r.profiles.map(p => el('option', { value: p, ...(p === r.profile ? { selected: 'selected' } : {}) }, p)))

  const facts = el('div', { class: 'list' },
    r.facts.length
      ? r.facts.map(f => el('div', { class: 'item' },
        el('span', { class: 'name' }, f.key),
        el('span', { class: 'desc' }, String(f.value)),
      ))
      : el('div', { class: 'empty' }, '还没有关于他的资料'),
  )
  const hidden = r.hidden.length
    ? el('pre', { class: 'block', text: r.hidden.map(h => h.key + '：' + h.value).join('\n') })
    : el('div', { class: 'empty' }, '没有临时状态（场景 / 我是谁 / 同场）')

  const ctx = el('pre', { class: 'block', text: r.ctx.map(m => (m.role === 'user' ? '主人' : '她') + '：' + m.content).join('\n') || '（空）' })

  /* ---- 可视化：最近 14 天事件分布 + 高频词 ---- */
  const days = []
  for (let i = 13; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000)
    days.push({ key: `${d.getMonth() + 1}/${d.getDate()}`, start: new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(), n: 0 })
  }
  const stop = new Set('的了我她是和一个有没有就不都在人啊呀呢吧吗么很到说要去你也这那'.split(''))
  const words = {}
  for (const e of r.episodes) {
    const t = Number(e.t || 0)
    const day = days.find(d => t >= d.start && t < d.start + 86400000)
    if (day) day.n++
    for (const w of String(e.text || '').split(/[，。！？、\s（）…~“”"]+/)) {
      if (w.length >= 2 && w.length <= 12 && ![...w].every(c => stop.has(c))) words[w] = (words[w] || 0) + 1
    }
  }
  const top = Object.entries(words).sort((a, b) => b[1] - a[1]).slice(0, 10)
  const maxN = Math.max(1, ...days.map(d => d.n))
  const viz = el('div', { class: 'card' },
    el('h3', {}, '这半月她记了什么'),
    el('div', { class: 'kv' }, el('span', { class: 'k' }, '事件'), el('span', { class: 'v' }, `${r.episodes.length} 条 · 活跃 ${days.filter(d => d.n).length}/14 天`)),
    el('div', { class: 'stat' }, days.map(d => el('i', { style: `height:${Math.max(3, Math.round(d.n / maxN * 100))}%`, title: `${d.key} · ${d.n} 条` }))),
    el('div', { class: 'stat-lab' }, days.filter((_, i) => i % 2 === 0).map(d => el('span', {}, d.key))),
    top.length ? el('div', { class: 'row', style: 'margin-top:8px' },
      top.map(([w, n]) => el('span', { class: 'pill' }, `${w}×${n}`))) : null,
  )

  main.replaceChildren(
    el('div', { class: 'row', style: 'margin-bottom:4px' },
      el('span', { class: 'muted' }, '存档'), sel,
      btn('清空对话', async () => {
        if (!confirm('清掉这个存档的上下文 / 摘要 / 事件？')) return
        await post('/api/memory/forget', { keepFacts: false })
        toast('已清空'); tabMem(r.profile)
      }, 'act danger'),
      btn('只清对话，保留资料', async () => {
        await post('/api/memory/forget', { keepFacts: true })
        toast('已清对话'); tabMem(r.profile)
      }),
    ),

    c ? el('div', { class: 'card', style: 'margin-top:12px' },
      el('h3', {}, '上下文占用', el('span', { class: 'go' }, c.usage.limit + ' token 窗口')),
      el('div', { class: 'bar' }, el('i', { class: hi ? 'hi' : '', style: 'width:' + pct + '%' })),
      el('div', { class: 'row', style: 'justify-content:space-between' },
        el('span', { class: 'muted' }, c.text + ' · ' + c.turns + ' 轮'),
        el('span', { class: 'muted' }, c.left !== Infinity && Number.isFinite(c.left)
          ? (c.left > 400 ? '还能聊很久' : '还能聊约 ' + c.left + ' 轮')
          : ''),
      ),
      el('div', { class: 'row', style: 'margin-top:10px' },
        btn('压缩一次', async () => {
          if (!confirm('压掉旧的轮次换成摘要？压完语气可能会淡一点。')) return
          toast('压缩中…')
          const x = await post('/api/compress', {})
          toast(x.ok ? x.msg : (x.msg || '失败'))
          if (x.ok) tabMem(r.profile)
        }, 'act primary'),
        el('span', { class: 'muted' }, '策略：' + (c.mode === 'auto' ? '自动压' : c.mode === 'manual' ? '只手动' : '到线提醒（不自动压）')),
      ),
    ) : null,

    viz,

    el('h2', { class: 'sec' }, '摘要'),
    el('pre', { class: 'block', text: r.summary.text || '（还没压缩过）' }),
    el('div', { class: 'split' },
      el('div', {}, el('h2', { class: 'sec' }, '关于他'), facts),
      el('div', {}, el('h2', { class: 'sec' }, '临时状态'), hidden),
    ),
    el('h2', { class: 'sec' }, '最近事件（' + r.episodes.length + '）'),
    el('pre', { class: 'block', text: r.episodes.map(e => '· ' + e.text).join('\n') || '（无）' }),
    el('h2', { class: 'sec' }, '最近对话'),
    ctx,
  )
}

  const patch = {
    enabled: $('#cEnabled').checked,
    active: $('#cActive').value,
    chat: { ...cfgCache.chat, maxReplyChars: Number($('#cMaxChars').value) || 80 },
    compress: { ...cfgCache.compress, enabled: $('#cMode').value !== 'manual', mode: $('#cMode').value, triggerTurns: Number($('#cTrigger').value) || 16 },
    scope: {
      ...cfgCache.scope,
      unlockEnabled: $('#cUnlock').checked,
      unlockKey: ($('#cKey').value.trim() || '喵呜').slice(0, 12),
      unlockNotify: $('#cNotify').checked,
      whitelist: $('#cWl').value.split('\n').map(s => s.trim()).filter(s => /^\d{5,12}$/.test(s)),
    },
    draw: { ...cfgCache.draw, enabled: $('#cDraw').checked, bridgeUrl: $('#cDrawUrl').value.trim() },
    clock: { ...cfgCache.clock, enabled: $('#cClock').checked, reminds: $('#cRemind').checked },
    proactive: {
      ...cfgCache.proactive,

      style: $('#cProStyle').value,
      maxPerDay: Number($('#cProMax').value) || 3,
      minIdleMin: Number($('#cProMin').value) || 120,
      nightQuiet: $('#cProNight').checked,
      topics,
    },
    tavern: { ...cfgCache.tavern, autoOpening: $('#cOpening').checked },
    webui: { ...cfgCache.webui, host: $('#cHost').value, port: Number($('#cPort').value) || 5199 },
  }
  const r = await post('/api/config', { patch })
  if (!r.ok) return toast(r.msg || '保存失败')
  const b = r.webui
  if (b && b.ok === false) toast('已保存，但控制台没切过去：' + b.msg)
  else if (b && b.changed) {
    const url = b.host === '0.0.0.0'
      ? (b.lan && b.lan.length ? `http://${b.lan[0]}:${b.port}` : `端口 ${b.port}`)
      : `http://127.0.0.1:${b.port}`
    toast('已切换，手机开 ' + url)
  } else toast('已保存')
  if (r.ok) tabCfg()
}

async function saveJson() {
  let obj
  try { obj = JSON.parse($('#cJson').value) } catch (e) { return toast('JSON 格式不对：' + e.message) }
  const r = await post('/api/config', { patch: obj })
  toast(r.ok ? '已保存' : (r.msg || '失败'))
  if (r.ok) tabCfg()
}

/* ================= 服务进程（概览卡片） ================= */
async function renderServices() {
  const box = $('#svcBox')
  if (!box) return
  try {
    const r = await api('/api/proc')
    if (!r.ok || !box.isConnected) return
    box.replaceChildren(...r.list.map(s => el('div', { class: 'svc' },
      el('span', { class: 'dot ' + (s.up ? 'ok' : 'bad') }),
      el('span', { class: 'name' }, s.name),
      el('span', { class: 'desc' }, s.up ? '运行中' : '没在跑 · ' + s.managed),
      s.startable && !s.up ? btn('启动', async () => {
        toast('启动中…')
        const x = await post('/api/proc/start', { name: s.key })
        toast(x.msg || (x.ok ? '已发起启动' : '失败'))
        if (x.ok) setTimeout(renderServices, 8000)
      }) : null,
    )))
  } catch { box.textContent = '探测失败' }
}

/* ================= 语音 ================= */
async function tabVoice() {
  const [st1, cfg] = await Promise.all([api('/api/tts'), api('/api/config')])
  const t = cfg.config.tts || {}
  const mk = (label, node) => el('div', { class: 'kv' }, el('span', { class: 'k' }, label), el('span', { class: 'v' }, node))
  const full = (label, node) => el('div', { class: 'kv full' }, el('span', { class: 'k' }, label), node)
  const chk = (id, on, label) => el('label', { style: 'display:flex;gap:6px;align-items:center;font-size:13px' },
    el('input', { type: 'checkbox', id, ...(on ? { checked: 'checked' } : {}) }), label)
  const txt = (label, id, v, ph = '') => full(label, el('input', { type: 'text', id, value: String(v ?? ''), placeholder: ph }))

  const s = st1.status || {}
  const audioBox = el('div', { id: 'voiceAudio' })

  main.replaceChildren(
    el('div', { class: 'card' },
      el('h3', {}, '语音服务'),
      el('div', { class: 'kv' }, el('span', { class: 'k' }, '服务'), el('span', { class: 'v ' + (s.ok ? 'ok' : 'bad') }, s.ok ? '在线' : (s.msg || '未连上'))),
      el('div', { class: 'kv' }, el('span', { class: 'k' }, '地址'), el('span', { class: 'v' }, s.url || t.url || '-')),
      el('div', { class: 'row', style: 'margin-top:8px' },
        btn('试听一句', async () => {
          toast('合成中…')
          audioBox.replaceChildren()
          const r = await post('/api/tts/test', {})
          if (r.ok && r.file) {
            audioBox.replaceChildren(el('audio', { controls: 'controls', autoplay: 'autoplay', src: '/api/tts/audio?file=' + encodeURIComponent(r.file), style: 'width:100%' }))
            toast('出来了，听吧')
          } else toast(r.msg || '合成失败（服务没开？）')
        }, 'act primary'),
        el('span', { class: 'muted' }, '服务没开就先去把它跑起来（GPT-SoVITS 的 api_v2）'),
      ),
      audioBox,
    ),

    el('h2', { class: 'sec' }, '语音设置'),
    el('div', { class: 'card' },
      chk('cTts', t.enabled === true, '启用语音（她说话偶尔/每条都带语音）'),
      full('引擎', el('select', { id: 'cTtsEngine' },
        [['gptsovits', 'GPT-SoVITS'], ['openai', 'OpenAI 兼容 /v1/audio/speech']].map(([v, n]) =>
          el('option', { value: v, ...(String(t.engine || 'gptsovits') === v ? { selected: 'selected' } : {}) }, n)))),
      txt('服务地址', 'cTtsUrl', t.url || 'http://127.0.0.1:9880'),
      txt('参考音频（绝对路径，音色就听它）', 'cTtsRef', t.refAudio || '', 'E:\\voice\\ref.wav'),
      txt('参考音频里说的那句（一字不差）', 'cTtsRefText', t.refText || ''),
      full('发送策略', el('select', { id: 'cTtsMode' },
        [['sometimes', '偶尔发'], ['all', '每条都发'], ['off', '只发文字']].map(([v, n]) =>
          el('option', { value: v, ...(String(t.mode || 'sometimes') === v ? { selected: 'selected' } : {}) }, n)))),
      mk('偶尔发的概率 %', el('input', { type: 'number', id: 'cTtsChance', value: String(Math.round((t.chance ?? 0.25) * 100)), style: 'width:92px;text-align:right' })),
      chk('cTtsKeep', t.keepText !== false, '发语音的同时也发文字'),
    ),
    el('div', { class: 'row', style: 'margin:12px 0' },
      btn('保存语音设置', async () => {
        const r = await post('/api/config', { patch: { tts: {
          ...t,
          enabled: $('#cTts').checked,
          engine: $('#cTtsEngine').value,
          url: $('#cTtsUrl').value.trim(),
          refAudio: $('#cTtsRef').value.trim(),
          refText: $('#cTtsRefText').value.trim(),
          mode: $('#cTtsMode').value,
          chance: Math.max(0, Math.min(100, Number($('#cTtsChance').value) || 0)) / 100,
          keepText: $('#cTtsKeep').checked,
        } } })
        toast(r.ok ? '已保存' : (r.msg || '失败'))
        if (r.ok) tabVoice()
      }, 'act primary'),
      el('span', { class: 'muted' }, '参考音频要 5~10 秒干净人声；refText 必须和音频里说的完全一致'),
    ),
  )
}

/* ================= 插件（模块开关 + 自定义扩展） ================= */
async function tabMods() {
  const r = await api('/api/modules')
  const exts = await api('/api/ext')

  const modList = el('div', { class: 'list' }, r.list.map(m => el('div', { class: 'item' },
    el('span', { class: 'name' }, m.name),
    el('span', { class: 'desc' }, m.desc),
    el('span', { class: 'pill ' + (m.enabled ? 'ok' : '') }, m.enabled ? '开' : '关'),
    btn(m.enabled ? '关' : '开', async () => {
      const x = await post('/api/modules', { key: m.key, enabled: !m.enabled })
      toast(x.ok ? (m.enabled ? '已关闭，即刻生效' : '已开启，即刻生效') : (x.msg || '失败'))
      if (x.ok) tabMods()
    }),
  )))

  const extList = el('div', { class: 'list' },
    exts.list.length ? exts.list.map(f => el('div', { class: 'item' },
      el('span', { class: 'name' }, f),
      el('span', { class: 'desc' }, '已加载，重进控制台生效'),
      btn('编辑', async () => {
        const resp = await fetch('/ext/' + encodeURIComponent(f))
        $('#extCode').value = await resp.text()
        $('#extName').value = f.replace(/\.js$/, '')
        $('#extName').scrollIntoView({ behavior: 'smooth', block: 'center' })
      }),
      btn('删除', async () => {
        if (!confirm('删掉扩展 ' + f + '？')) return
        await del('/api/ext?name=' + encodeURIComponent(f.replace(/\.js$/, '')))
        toast('已删除'); tabMods()
      }, 'act danger'),
    )) : el('div', { class: 'empty' }, '还没有扩展。写一个试试 —— 见下面的说明。'),
  )

  main.replaceChildren(
    el('h2', { class: 'sec' }, '功能开关'),
    el('div', { class: 'muted', style: 'margin-bottom:8px' }, '关掉的模块即刻静默，不用重启；再打开也即刻生效。'),
    modList,

    el('h2', { class: 'sec' }, '自定义扩展'),
    el('div', { class: 'card' },
      el('h3', {}, '扩展怎么写'),
      el('pre', { class: 'block', style: 'max-height:none',
        text:
'扩展是一个 .js 文件，登录后的控制台会自动加载执行。\n' +
'约定：把你的界面挂到 window.miaoWuExt 上——\n\n' +
'window.miaoWuExt = {\n' +
'  name: "我的小工具",            // 显示名\n' +
'  render(box, { el, api, post, toast }) {  // 控制台打开时调用\n' +
'    box.append(el("button", { class: "act",\n' +
'      onclick: async () => {\n' +
'        const r = await api("/api/state")\n' +
'        toast("当前角色：" + (r.card ? r.card.name : "无"))\n' +
'      },\n' +
'    }, "报个状态"))\n' +
'  },\n' +
'}\n\n' +
'能用的东西：el/api/post/toast，以及整个后端的 /api/* 接口。\n' +
'文件保存在 config/webui-ext/，想分享给别人直接发那个 .js 文件。' }),
    ),
    el('div', { class: 'list' }, extList),
    el('h2', { class: 'sec' }, '新建 / 编辑'),
    el('div', { class: 'row' },
      el('input', { type: 'text', id: 'extName', placeholder: '扩展名（字母数字-_）', style: 'width:220px' }),
      btn('保存', async () => {
        const name = $('#extName').value.trim()
        const code = $('#extCode').value
        if (!name) return toast('先起个名')
        const x = await post('/api/ext', { name, code })
        toast(x.ok ? '已保存，刷新页面生效' : (x.msg || '失败'))
        if (x.ok) tabMods()
      }, 'act primary'),
    ),
    el('textarea', { id: 'extCode', spellcheck: 'false', style: 'min-height:200px',
      placeholder: 'window.miaoWuExt = { name: "...", render(box, h) { ... } }' }),
  )
}

/* ================= API 接入（providers 管理） ================= */
async function tabApi() {
  const r = await api('/api/providers')
  const rows = el('div', { class: 'list' }, r.list.map(p => el('div', { class: 'item', style: 'flex-wrap:wrap' },
    el('span', { class: 'name' }, (p.name === r.active ? '▸ ' : '') + p.name),
    el('span', { class: 'pill' }, p.type),
    el('span', { class: 'desc' }, p.model + ' · ' + p.baseUrl + ' · key ' + p.key),
    p.name !== r.active ? btn('启用', async () => {
      const x = await post('/api/active', { name: p.name })
      toast(x.ok ? '已切到 ' + p.name : (x.msg || '失败'))
      if (x.ok) tabApi()
    }) : el('span', { class: 'pill ok' }, '使用中'),
    btn('测试', async () => {
      toast('打一句试试…')
      const x = await post('/api/providers/test', { name: p.name })
      toast(x.ok ? `✓ ${p.name} 正常（${x.ms}ms）：${x.sample}` : `✗ 失败：${(x.msg || '').slice(0, 80)}`)
    }),
    btn('删', async () => {
      if (!confirm('删掉后端 ' + p.name + '？')) return
      const x = await post('/api/providers/delete', { name: p.name })
      toast(x.msg || (x.ok ? '已删除' : '失败'))
      if (x.ok) tabApi()
    }, 'act danger'),
  )))

  const f = (label, id, v = '', ph = '', type = 'text') => el('div', { class: 'kv full' },
    el('span', { class: 'k' }, label),
    el('input', { type, id, value: String(v), placeholder: ph }))

  main.replaceChildren(
    el('div', { class: 'card' },
      el('h3', {}, '当前使用'), el('div', { class: 'kv' },
        el('span', { class: 'k' }, 'active'),
        el('span', { class: 'v ok' }, r.active)),
      el('div', { class: 'muted', style: 'margin-top:4px' }, '聊天 / 绘图方案 / 压缩默认都走它；在「配置」页也能切。'),
    ),
    el('h2', { class: 'sec' }, '后端（' + r.list.length + '）'),
    rows,
    el('h2', { class: 'sec' }, '新增 / 修改'),
    el('div', { class: 'card' },
      f('名字（唯一的，同名即修改）', 'apName', '', 'my-gemini'),
      f('模型', 'apModel', '', 'gemini-3.8-flash-high'),
      f('接口地址', 'apUrl', 'http://127.0.0.1:8317/v1', 'https://api.xxx.com/v1'),
      f('apiKey（留空 = 沿用旧的）', 'apKey', '', 'sk-...', 'password'),
      f('降级模型（可选）', 'apFb', '', 'claude-sonnet-5-5-high'),
      el('div', { class: 'row', style: 'margin-top:10px' },
        btn('保存', async () => {
          const name = $('#apName').value.trim()
          if (!name) return toast('先起名')
          const x = await post('/api/providers/save', { name, patch: {
            model: $('#apModel').value.trim(),
            baseUrl: $('#apUrl').value.trim(),
            apiKey: $('#apKey').value.trim(),
            fallbackModel: $('#apFb').value.trim(),
            type: 'openai',
          } })
          toast(x.ok ? '已保存' : (x.msg || '失败'))
          if (x.ok) tabApi()
        }, 'act primary'),
        btn('保存并启用', async () => {
          const name = $('#apName').value.trim()
          if (!name) return toast('先起名')
          await post('/api/providers/save', { name, patch: {
            model: $('#apModel').value.trim(),
            baseUrl: $('#apUrl').value.trim(),
            apiKey: $('#apKey').value.trim(),
            fallbackModel: $('#apFb').value.trim(),
            type: 'openai',
          } })
          const x = await post('/api/active', { name })
          toast(x.ok ? '已启用 ' + name : (x.msg || '失败'))
          if (x.ok) tabApi()
        }),
        el('span', { class: 'muted' }, '保存即热加载，不用重启'),
      ),
    ),
  )
}

/* ================= 路由 ================= */
const TABS = { home: tabHome, chars: tabChars, mem: () => tabMem(), clock: tabClock, st: tabSt, voice: tabVoice, mods: tabMods, api: tabApi, health: tabHealth, cfg: tabCfg }

function switchTab(t) {
  TAB = t
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t))
  const on = document.querySelector('nav button.on')
  if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' })
  main.replaceChildren(el('div', { class: 'empty' }, '加载中…'))
  window.scrollTo(0, 0)
  const fn = TABS[t] || tabHome
  Promise.resolve(fn()).catch(e => main.replaceChildren(el('div', { class: 'empty' }, '出错了：' + e.message)))
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)))
async function logout() {
  await api('/api/logout')
  location.href = '/'
}

/* 支持 #mem 这种直链，方便收藏 */
loadWho().finally(() => {
  const h = (location.hash || '').replace('#', '')
  switchTab(TABS[h] ? h : 'home')
})

/* 二维码常驻轮询：掉线自动出码，扫码后自动消失 */
pollQR()

/* ================= 自定义扩展 ================= */
async function loadExts() {
  try {
    const r = await api('/api/ext')
    if (!r.ok) return
    for (const f of r.list) {
      const s = document.createElement('script')
      s.src = '/ext/' + encodeURIComponent(f)
      s.onload = () => {
        const ext = window.miaoWuExt
        if (!ext || typeof ext.render !== 'function') return
        // 给扩展一个落点：每次切到概览页都重新渲染它的容器
        const mount = () => {
          const box = $('#extZone')
          if (!box || !box.isConnected) return
          const one = el('div', { class: 'card', style: 'margin-top:12px' },
            el('h3', {}, ext.name || f))
          try { ext.render(one, { el, api, post, toast, btn }) } catch (e) { one.append(el('div', { class: 'bad' }, '扩展出错：' + e.message)) }
          box.append(one)
        }
        document.body.addEventListener('tab:home', mount)
        mount()
      }
      document.head.append(s)
    }
  } catch {}
}
const _switchTab = switchTab
switchTab = function (t) {
  _switchTab(t)
  if (t === 'home') setTimeout(() => document.body.dispatchEvent(new Event('tab:home')), 100)
}
